<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vj-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="vj-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#vj-gradient)" />
  <!-- "V" letter in white -->
  <path d="M12 20 L23 44 L34 20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- "J" letter in sky blue with serif hook -->
  <path d="M48 20 V38 C48 44 42 46 36 44" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Accent dot -->
  <circle cx="50" cy="46" r="3.5" fill="#10B981" />
</svg>
