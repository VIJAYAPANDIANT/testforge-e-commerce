<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tf-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#tf-gradient)" />
  <!-- Modern Geometric "TF" Monogram with Shopping / Forge vibe -->
  <path d="M14 18 H36 M25 18 V46" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M36 26 H50 M36 26 V46 M36 36 H47" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Ambient accent dot -->
  <circle cx="50" cy="46" r="3.5" fill="#F43F5E" />
</svg>
